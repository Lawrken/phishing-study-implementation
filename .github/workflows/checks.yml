name: Source and controlled-fixture checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r replication/requirements-host.txt
      - run: python -B -m unittest discover -s host-tools -p 'Test*.py'
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r replication/requirements-guest.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B phishing-study/scripts/verify.py --require-browser --output /tmp/research-suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-linux-suite
          path: /tmp/research-suite/
