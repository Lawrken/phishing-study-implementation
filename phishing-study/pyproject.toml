[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-layer-phishing-study"
version = "0.1.1"
description = "Reproducible endpoint observations for a phishing research study"
requires-python = ">=3.11"
dependencies = ["playwright==1.63.0", "tldextract==5.4.0", "dnspython==2.9.0", "pyarrow==26.0.0"]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<4", "scipy>=1.13,<2", "scikit-learn>=1.5,<2"]

[project.scripts]
phishing-study = "study.cli:main"

[tool.setuptools.packages.find]
include = ["study*"]
